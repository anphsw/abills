get:
  tags:
    - addresses
  summary: Получить улицы
  description: Возвращает список улиц. Работает если включен модуль Referral
  operationId: getStreets
  parameters:
    - name: districtId
      in: query
      description: ID района.
      schema:
        type: boolean
        default: true
    - $ref: "#/components/parameters/pageRows"
  responses:
    200:
      description: Успешное выполнение
      content:
        application/json:
          schema:
            $ref: "../schemas/streets.yaml"
  security:
    - USERSID: []
