get:
  tags:
    - storage
  summary: Список накладных
  parameters:
    - name: id
      in: query
      description: ID накладной
      schema:
        type: boolean
        default: true
    - name: invoice_number
      in: query
      description: Номер накладной
      schema:
        type: boolean
        default: false
    - name: date
      in: query
      description: Дата накладной
      schema:
        type: boolean
        default: false
    - name: supplier_id
      in: query
      description: ID поставщика
      schema:
        type: boolean
        default: false
    - name: payer_id
      in: query
      description: ID плательщика
      schema:
        type: boolean
        default: false
    - $ref: "#/components/parameters/desc"
    - $ref: "#/components/parameters/pageRows"
    - $ref: "#/components/parameters/pg"
    - $ref: "#/components/parameters/sort"
  responses:
    200:
      description: Успешное выполнение
      content:
        application/json:
          schema:
            $ref: "../schemas/invoicesList.yaml"
  security:
    - KEY: [ ]